services:
  web:
    container_name: ai-portfolio-web
    build:
      context: ./apps/web
    env_file:
      - ./apps/web/.env.local
    ports:
      - "3000:3000"
    volumes:
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    networks:
      - ai-portfolio-network
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./apps/web/package.json
    restart: unless-stopped

  api:
    container_name: ai-portfolio-api
    build:
      context: ./services/api
    env_file:
      - ./services/api/.env
    ports:
      - "3001:3001"
    volumes:
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    networks:
      - ai-portfolio-network
    develop:
      watch:
        - action: sync
          path: ./services/api
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./services/api/package.json
        - action: rebuild
          path: ./services/api/Dockerfile
    restart: unless-stopped

  ai:
    container_name: ai-portfolio-ai
    build:
      context: ./services/ai
    env_file:
      - ./services/ai/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-portfolio-network
    develop:
      watch:
        - action: sync
          path: ./services/ai
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./services/ai/requirements.txt
        - action: rebuild
          path: ./services/ai/Dockerfile
    volumes:
      - ai_venv:/app/.venv
    restart: unless-stopped

  postgres:
    container_name: ai-portfolio-postgres
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai-portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-portfolio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  web_node_modules:
  api_node_modules:
  ai_venv:

networks:
  ai-portfolio-network:
    driver: bridge